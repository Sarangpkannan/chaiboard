<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaiboard | Register Personnel Credential</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            position: relative;
            z-index: 10;
        }
        .auth-box {
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 480px;
            padding: 2.6rem;
            box-shadow: var(--shadow-card), var(--shadow-glow);
        }
        .auth-brand {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-icon-badge {
            width: 52px;
            height: 52px;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--chai-amber), var(--neon-cyan));
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.8rem;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.45);
        }
        .auth-icon-badge svg {
            width: 28px;
            height: 28px;
            stroke: #08090d;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-box tilt-card-3d">
            <div class="auth-brand">
                <div class="auth-icon-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 8h1a4 4 0 1 1 0 8h-1"></path>
                        <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path>
                        <line x1="6" y1="2" x2="6" y2="4"></line>
                        <line x1="10" y1="2" x2="10" y2="4"></line>
                        <line x1="14" y1="2" x2="14" y2="4"></line>
                    </svg>
                </div>
                <h1 class="brand-title animated-h3" style="font-size: 1.75rem; font-weight: 800; letter-spacing: -0.03em; display: block;">Operator Registration</h1>
                <div style="font-size: 0.72rem; color: var(--neon-cyan); text-transform: uppercase; font-weight: 700; letter-spacing: 0.8px; margin-top: 0.2rem;">
                    Institutional Identity &amp; Compliance Ledger
                </div>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.5rem;">
                    Provision an authorized operator credential to track beverage intake, health metrics, and departmental standing.
                </p>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="e.g. Siddharth Rao" required>
                </div>

                <div class="form-group">
                    <label for="email">Institutional Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="e.g. user@example.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="department">Assigned Academic Department</label>
                    <select id="department" class="form-control" required>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Mechanical Engineering">Mechanical Engineering</option>
                        <option value="Electronics & Comm">Electronics &amp; Comm</option>
                        <option value="Biotechnology">Biotechnology</option>
                        <option value="Civil Engineering">Civil Engineering</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="password">Create Security Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Minimum 4 characters" required autocomplete="new-password">
                </div>

                <button type="submit" id="btn-submit" class="btn btn-primary full-width" style="margin-top: 1rem;">
                    Create Operator Credential
                </button>
            </form>

            <div style="margin-top: 1.5rem; text-align: center; font-size: 0.84rem; color: var(--text-muted);">
                Already have credentials? <a href="/login" style="color: var(--chai-amber); text-decoration: underline; font-weight: 600;">Sign In</a>
            </div>
        </div>
    </div>

    <!-- Background Engine -->
    <script src="/static/js/tubes-background.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const department = document.getElementById('department').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-submit');

            btn.disabled = true;
            btn.textContent = 'Registering Account...';

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, department, password })
                });

                const data = await res.json();
                if (res.ok) {
                    alert('Registration successful. Please sign in with your credentials.');
                    window.location.href = '/login';
                } else {
                    alert('Registration failed: ' + (data.error || 'Please check inputs.'));
                }
            } catch (err) {
                alert('Connection error occurred.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Create Operator Credential';
            }
        });
    </script>
</body>
</html>
